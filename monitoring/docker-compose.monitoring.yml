# monitoring/docker-compose.monitoring.yml
#
# Monitoring stack for IntelliDoc — Prometheus + Grafana
#
# Usage:
#   Start together with the API stack:
#     docker compose -f backend/docker-compose.yaml -f monitoring/docker-compose.monitoring.yml up -d
#
#   Or run monitoring stack standalone (needs the API running separately):
#     docker compose -f monitoring/docker-compose.monitoring.yml up -d
#
# Access:
#   Grafana  → http://localhost:3001  (admin / intellidoc)
#   Prometheus → http://localhost:9090

version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: intellidoc-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana-oss:11.0.0
    container_name: intellidoc-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"  # 3001 to avoid conflict with Next.js on 3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: intellidoc
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/intellidoc_api.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
